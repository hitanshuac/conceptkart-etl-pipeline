[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version"
]
commit_message = "chore(release): v{version} [skip ci]"
commit_parser = "angular"
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "(main|master)"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "chore",
    "docs",
    "test"
]

[project]
name = "conceptkart-etl-pipeline"
version = "1.0.0"
description = "Production-Grade Dynamic Pricing Tracker"
authors = [
    { name = "Antigravity Environment", email = "auto@example.com" }
]
dependencies = [
    "requests",
    "beautifulsoup4",
    "supabase",
    "python-dotenv",
    "curl-cffi",
    "crawl4ai",
    "pydantic",
    "duckdb",
    "pyarrow",
    "apscheduler",
    "python-semantic-release"
]
